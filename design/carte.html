<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>VolleySpot – modèles de carte</title>
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css"><link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
body{margin:0;background:#F5F1E7;color:#182B2E;font:15px/1.5 Inter,system-ui,sans-serif}
header{padding:22px 18px 6px;max-width:1240px;margin:0 auto}h1{font:800 26px/1.1 Archivo,sans-serif;margin:0 0 6px}h1 span{color:#E14F3D}
header p{margin:0;color:#5E6E71}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:16px 18px 40px;max-width:1240px;margin:0 auto}
@media(max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:#fff;border:1px solid #E3DDCE;border-radius:18px;overflow:hidden}
.card h2{font:800 18px/1.2 Archivo,sans-serif;margin:0}.card .t{padding:12px 14px 4px;display:flex;align-items:baseline;gap:8px}
.card .t b{font:700 12px Inter;color:#fff;background:#182B2E;border-radius:6px;padding:2px 7px}
.card p{margin:0;padding:0 14px 12px;color:#5E6E71;font-size:13.5px}
.map{height:400px}
/* pins */
.pin{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.pin svg{width:14px;height:14px}
.cl{border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 13px Archivo,sans-serif}
/* 0 actuel */
.m0 .pin{background:#38BDF8;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25)}.m0 .cl{background:#38BDF8;color:#fff;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.18)}
/* 1 sable */
.m1 .pin{background:#E14F3D;border:2.5px solid #FBF7EE;box-shadow:0 2px 0 rgba(24,43,46,.25),0 4px 10px rgba(24,43,46,.18)}
.m1 .pin.sable{background:#C98A3A}.m1 .pin.herbe{background:#1B8A7E}.m1 .pin.bitume{background:#7C5CD6}
.m1 .cl{background:#FBF7EE;color:#E14F3D;border:2.5px solid #E14F3D;box-shadow:0 4px 12px rgba(24,43,46,.18)}
/* 2 epure */
.m2 .pin{background:#0F6B62;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);width:22px;height:22px}
.m2 .pin svg{width:12px;height:12px}
.m2 .pin.sable{background:#C98A3A}.m2 .pin.herbe{background:#1B8A7E}.m2 .pin.bitume{background:#7C5CD6}
.m2 .cl{background:#182B2E;color:#fff;box-shadow:0 0 0 5px rgba(24,43,46,.12)}
/* 3 nuit */
.m3 .map{background:#1b1f24}
.m3 .pin{background:#E14F3D;border:2px solid #FFD9D3;box-shadow:0 0 0 4px rgba(225,79,61,.25),0 0 16px rgba(225,79,61,.7)}
.m3 .pin.sable{background:#E9A94B;border-color:#FDE9C8;box-shadow:0 0 14px rgba(233,169,75,.7)}.m3 .pin.herbe{background:#2BB3A3;border-color:#C9F2EC;box-shadow:0 0 14px rgba(43,179,163,.7)}.m3 .pin.bitume{background:#9B7CF0;border-color:#E3DAFF;box-shadow:0 0 14px rgba(155,124,240,.7)}
.m3 .cl{background:rgba(225,79,61,.18);color:#fff;border:2px solid #E14F3D;box-shadow:0 0 18px rgba(225,79,61,.55)}
/* filtres sur le plan IGN */
.m1 .leaflet-tile-pane{filter:saturate(.45) sepia(.28) brightness(1.04) contrast(.95)}
.m2 .leaflet-tile-pane{filter:grayscale(1) brightness(1.1) contrast(.82)}
.m3 .leaflet-tile-pane{filter:invert(1) hue-rotate(190deg) grayscale(.55) brightness(.82) contrast(.92)}
/* 4 satellite */
.m4 .pin{background:#E14F3D;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.m4 .pin.sable{background:#C98A3A}.m4 .pin.herbe{background:#1B8A7E}.m4 .pin.bitume{background:#7C5CD6}
.m4 .cl{background:#fff;color:#E14F3D;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.leg{display:flex;flex-wrap:wrap;gap:12px;padding:10px 14px 14px;font-size:12.5px;color:#5E6E71}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
</style></head><body>

{

const IGN='https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=image/png', ORTHO='https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=image/jpeg';
const M=[
 {k:'Actuel',n:'Aujourd\u2019hui',d:'OpenStreetMap standard. Très détaillé, couleurs vives : les clubs se perdent dans le fond.',url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',att:'© OpenStreetMap'},
 {k:'A',n:'Sable',d:'Plan IGN adouci et réchauffé pour coller aux tons sable de l\u2019appli. Clubs en corail, terrains par couleur de surface. Le plus cohérent avec l\u2019identité.',url:IGN,att:'© IGN Géoplateforme'},

];

const maps=[];
M.forEach((m,i)=>{
  const map=L.map('map'+i,{zoomControl:true,scrollWheelZoom:false}).setView([48.855,2.35],12);

  const grp=L.markerClusterGroup({maxClusterRadius:46,showCoverageOnHover:false,iconCreateFunction:c=>{const n=c.getChildCount(),s=n<10?34:n<30?40:46;return L.divIcon({className:'',html:`<div class="cl" style="width:${s}px;height:${s}px">${n}</div>`,iconSize:[s,s]})}});

  CLUBS.forEach(c=>grp.addLayer(L.marker([c[0],c[1]],{icon:pin('',BALL)}).bindTooltip(c[2])));

let sync=false;
maps.forEach(a=>a.on('moveend',()=>{if(sync)return;sync=true;maps.forEach(b=>{if(b!==a)b.setView(a.getCenter(),a.getZoom(),{animate:false})});sync=false;}));
